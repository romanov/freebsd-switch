# SwitchBSD USB-stick root. Network and SSH are started by
# /usr/local/etc/rc.d/switchbsd from the SD card's network.conf settings.
hostname="freebsd-switch"
# First boot: grow the root partition and file system to fill the stick.
growfs_enable="YES"
growfs_swap_size="0"
sshd_enable="NO"
ntpd_enable="NO"
sendmail_enable="NONE"
dumpdev="NO"
