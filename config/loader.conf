autoboot_delay="3"
boot_verbose="YES"
console="efi"
# Override serial-only detection of this firmware's vendor display path.
# Kernel messages go to both consoles; the screen is primary for /dev/console.
boot_multicons="YES"
boot_serial="NO"
efi_com_speed="115200"
kern.smp.disabled="1"
kernel="kernel"
mfsroot_load="YES"
mfsroot_type="mfs_root"
mfsroot_name="/boot/rootfs.ufs"
vfs.root.mountfrom="ufs:/dev/md0"
vfs.root.mountfrom.options="rw"
init_path="/sbin/init"
hw.uart.console="mm:0x70006040,rs:2,rw:1,br:115200,xo:408000000"
